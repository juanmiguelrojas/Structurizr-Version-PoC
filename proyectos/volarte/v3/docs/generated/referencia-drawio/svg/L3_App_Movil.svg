<text x="380" y="401.776" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Modulo de Autenticacion</text>
<text x="380" y="417.23199999999997" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: MSAL.js]</text>
<text x="380" y="443.89599999999996" font-size="11"  fill="#ffffff" text-anchor="middle">Flujo OAuth2 Authorization</text>
<text x="380" y="457.09599999999995" font-size="11"  fill="#ffffff" text-anchor="middle">Code + PKCE. Token en</text>
<text x="380" y="470.29599999999994" font-size="11"  fill="#ffffff" text-anchor="middle">memoria (no localStorage).</text>
<rect x="490" y="160" width="240" height="120" rx="7.2" fill="#63BEF2" stroke="#2086C9" stroke-width="1"/>
<text x="610" y="191.776" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Navegación</text>
<text x="610" y="207.232" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: React Navigation]</text>
<text x="610" y="233.896" font-size="11"  fill="#ffffff" text-anchor="middle">Pantallas del operario:</text>
<text x="610" y="247.09599999999998" font-size="11"  fill="#ffffff" text-anchor="middle">turnos, checklist, PQDA,</text>
<text x="610" y="260.296" font-size="11"  fill="#ffffff" text-anchor="middle">firma, historial.</text>
<rect x="550" y="430" width="240" height="120" rx="7.2" fill="#63BEF2" stroke="#2086C9" stroke-width="1"/>
<text x="670" y="461.776" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Base de Datos local</text>
<text x="670" y="477.23199999999997" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: WatermelonDB (SQLite)]</text>
<text x="670" y="503.89599999999996" font-size="11"  fill="#ffffff" text-anchor="middle">Réplica funcional: turnos,</text>
<text x="670" y="517.096" font-size="11"  fill="#ffffff" text-anchor="middle">operaciones, catálogos.</text>
<text x="670" y="530.296" font-size="11"  fill="#ffffff" text-anchor="middle">Fuente de verdad offline.</text>
<rect x="550" y="590" width="240" height="120" rx="7.2" fill="#63BEF2" stroke="#2086C9" stroke-width="1"/>
<text x="670" y="621.776" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Motor de Sincronización</text>
<text x="670" y="637.232" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: Cola + UUID]</text>
<text x="670" y="663.8960000000001" font-size="11"  fill="#ffffff" text-anchor="middle">Cola de escritura local.</text>
<text x="670" y="677.0960000000001" font-size="11"  fill="#ffffff" text-anchor="middle">Delta pull / push al</text>
<text x="670" y="690.2960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">reconectar. Aplica HU-050.</text>
<rect x="550" y="750" width="240" height="120" rx="7.2" fill="#63BEF2" stroke="#2086C9" stroke-width="1"/>
<text x="670" y="781.776" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Cliente API</text>
<text x="670" y="797.232" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: Fetch + Resumable Upload]</text>
<text x="670" y="823.8960000000001" font-size="11"  fill="#ffffff" text-anchor="middle">Sube cola pendiente,</text>
<text x="670" y="837.0960000000001" font-size="11"  fill="#ffffff" text-anchor="middle">descarga delta, sube</text>
<text x="670" y="850.2960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">media con reanudación.</text>
<rect x="880" y="120" width="240" height="120" rx="7.2" fill="#63BEF2" stroke="#2086C9" stroke-width="1"/>
<text x="1000" y="151.776" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Captura de Evidencia</text>
<text x="1000" y="167.232" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: Cámara + canvas Tactil]</text>
<text x="1000" y="193.896" font-size="11"  fill="#ffffff" text-anchor="middle">Fotos PQDA/checklist y</text>
<text x="1000" y="207.09599999999998" font-size="11"  fill="#ffffff" text-anchor="middle">firma. Guardado en</text>
<text x="1000" y="220.29599999999996" font-size="11"  fill="#ffffff" text-anchor="middle">filesystem local primero.</text>
<rect x="920" y="410" width="240" height="120" rx="7.2" fill="#63BEF2" stroke="#2086C9" stroke-width="1"/>
<text x="1040" y="441.776" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Disparador de Sync</text>
<text x="1040" y="457.23199999999997" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: Netinfo listener]</text>
<text x="1040" y="483.89599999999996" font-size="11"  fill="#ffffff" text-anchor="middle">Detecta reconexión y</text>
<text x="1040" y="497.09599999999995" font-size="11"  fill="#ffffff" text-anchor="middle">dispara el Motor de</text>
<text x="1040" y="510.29599999999994" font-size="11"  fill="#ffffff" text-anchor="middle">Sincronización.</text>
<rect x="80" y="770" width="240" height="120" rx="12" fill="#8C8496" stroke="#736782" stroke-width="1"/>
<text x="200" y="808.376" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">BFF Móvil</text>
<text x="200" y="823.832" font-size="12"  fill="#ffffff" text-anchor="middle">[Software System]</text>
<text x="200" y="850.4960000000001" font-size="11"  fill="#cccccc" text-anchor="middle">Vía Netskope/ZTNA (fuera de este</text>
<text x="200" y="863.6960000000001" font-size="11"  fill="#cccccc" text-anchor="middle">contenedor)</text>
<rect x="90" y="190" width="240" height="120" rx="12" fill="#8C8496" stroke="#736782" stroke-width="1"/>
<text x="210" y="234.976" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">EntraID</text>
<text x="210" y="250.432" font-size="12"  fill="#ffffff" text-anchor="middle">[Software System]</text>
<text x="210" y="277.096" font-size="11"  fill="#cccccc" text-anchor="middle">Login SSO (solo Entra ID)</text>
<rect x="290" y="940" width="240" height="140" rx="8.4" fill="#63BEF2" stroke="#2086C9" stroke-width="1"/>
<text x="410" y="961.976" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Netskope Client (ZTNA)</text>
<text x="410" y="977.432" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: Netskope Agent]</text>
<text x="410" y="1004.0960000000001" font-size="11"  fill="#ffffff" text-anchor="middle">Agente ZTNA embebido/</text>
<text x="410" y="1017.2960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">perfil de dispositivo.</text>
<text x="410" y="1030.496" font-size="11"  fill="#ffffff" text-anchor="middle">Verifica posture (Intune)</text>
<text x="410" y="1043.6960000000001" font-size="11"  fill="#ffffff" text-anchor="middle">antes de habilitar túnel</text>
<text x="410" y="1056.8960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">hacia BFF Móvil. Sin esto</text>
<text x="410" y="1070.0960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">no hay salida de red.</text>
<rect x="130" y="580" width="240" height="120" rx="7.2" fill="#63BEF2" stroke="#2086C9" stroke-width="1"/>
<text x="250" y="596.976" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Cifrado Local en Reposo</text>
<text x="250" y="612.432" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: SQLCipher + Android</text>
<text x="250" y="626.832" font-size="12"  fill="#ffffff" text-anchor="middle">Keystore]</text>
<text x="250" y="653.4960000000001" font-size="11"  fill="#ffffff" text-anchor="middle">Cifra la Base de Datos local (WatermelonDB).</text>
<text x="250" y="666.6960000000001" font-size="11"  fill="#ffffff" text-anchor="middle">Clave derivada del hardware del dispositivo,</text>
<text x="250" y="679.8960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">no exportable. Protege datos operacionales si</text>
<text x="250" y="693.0960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">el</text>
<text x="250" y="706.2960000000003" font-size="11"  fill="#ffffff" text-anchor="middle">dispositivo se pierde o es robado</text>
<rect x="910" y="620" width="240" height="120" rx="7.2" fill="#63BEF2" stroke="#2086C9" stroke-width="1"/>
<text x="1030" y="636.976" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Gestor de Estados de</text>
<text x="1030" y="656.176" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Sincronización</text>
<text x="1030" y="671.6320000000001" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: State Machine (local)]</text>
<text x="1030" y="698.2960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">Por cada ítem de la cola: PENDIENTE →</text>
<text x="1030" y="711.4960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">ENVIANDO → CONFIRMADO | CONFLICTO |</text>
<text x="1030" y="724.6960000000003" font-size="11"  fill="#ffffff" text-anchor="middle">ERROR. Reintento con backoff exponencial</text>
<text x="1030" y="737.8960000000003" font-size="11"  fill="#ffffff" text-anchor="middle">(base 5s, máx 5 min)</text>
<rect x="910" y="940" width="240" height="120" rx="7.2" fill="#63BEF2" stroke="#2086C9" stroke-width="1"/>
<text x="1030" y="965.176" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Component name</text>
<text x="1030" y="980.6320000000001" font-size="12"  fill="#ffffff" text-anchor="middle">[Component: Kotlin/TS — reglas locales]</text>
<text x="1030" y="1007.2960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">Detecta antes de reenviar: turno reasignado,</text>
<text x="1030" y="1020.4960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">recurso bloqueado, catálogo desactualizado.</text>
<text x="1030" y="1033.6960000000001" font-size="11"  fill="#ffffff" text-anchor="middle">Marca CONFLICTO_LOCAL, no descarta el</text>
<text x="1030" y="1046.8960000000002" font-size="11"  fill="#ffffff" text-anchor="middle">dato (hecho físico) y espera resolución.</text>
